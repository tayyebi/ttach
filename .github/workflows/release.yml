name: Release Builds

on:
  release:
    types: [published]

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make
      - name: Rename binary
        run: mv ttach ttach-linux
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ttach-linux
          path: ttach-linux
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" ttach-linux

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          update: true
          install: gcc make
      - name: Build
        run: make
      - name: Rename binary
        run: |
          if [ -f ttach.exe ]; then
            mv ttach.exe ttach-windows.exe
          else
            mv ttach ttach-windows.exe
          fi
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ttach-windows
          path: ttach-windows.exe
      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" ttach-windows.exe
